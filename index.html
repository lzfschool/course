<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程動態網頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#eef1ee;--panel:#ffffff;--ink:#1d2622;--muted:#5d6b64;--line:#cfd8d2;--accent:#1f7a5a;--accent-ink:#ffffff;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#141a17;--panel:#1c2420;--ink:#e3ebe6;--muted:#9aaba2;--line:#33403a;--accent:#4cc395;--accent-ink:#0f1a15;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;padding:24px 16px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{margin:2px 0 4px;font-size:clamp(24px,4vw,32px);font-weight:900;line-height:1.25}
.sub{color:var(--muted);margin:0;max-width:72ch}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
/* 選單 */
nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:760px){nav{position:static}}
nav label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
nav select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.chs{flex-direction:row;flex-wrap:wrap}}
.chs button{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.4}
.chs button:hover{border-color:var(--line)}
.chs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chs button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chs .cnt{font-size:12px;opacity:.75;margin-left:4px}
/* 內容 */
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.chhead h2{margin:0;font-size:21px}
.chhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
h3{font-size:16px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.card{display:flex;flex-direction:column;gap:5px;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.no{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.card b{font-size:16px;line-height:1.4}
.card .d{font-size:13.5px;color:var(--muted)}
.card.todo{opacity:.55;border-style:dashed}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">課程動態網頁</div>
    <h1 id="cTitle">課程</h1>
    <p class="sub" id="cDesc"></p>
  </header>

  <div class="layout">
    <nav aria-label="課程與章節">
      <div>
        <label for="courseSel">課程</label>
        <select id="courseSel"></select>
      </div>
      <div>
        <label id="chLbl">章節</label>
        <ul class="chs" id="chList" aria-labelledby="chLbl"></ul>
      </div>
    </nav>
    <main id="content" aria-live="polite"></main>
  </div>

  <footer>學習單紀錄只存在各自的瀏覽器中，換電腦或清除瀏覽資料後會消失。</footer>
</div>

<script src="courses.js"></script>
<script>
(()=>{
const C=window.COURSES||[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const countDone=ch=>ch.sections.reduce((n,s)=>n+s.items.filter(i=>i.href).length,0);
const countAll=ch=>ch.sections.reduce((n,s)=>n+s.items.length,0);

// 由網址參數或上次瀏覽決定目前的課程與章節
const q=new URLSearchParams(location.search);
let last={};try{last=JSON.parse(localStorage.getItem("course-index")||"{}")}catch(e){}
let course=C.find(c=>c.id===(q.get("course")||last.course))||C[0];
let chNo=q.get("ch")||last.ch;

function save(){
  try{localStorage.setItem("course-index",JSON.stringify({course:course.id,ch:chNo}))}catch(e){}
  const u=new URL(location.href);u.searchParams.set("course",course.id);u.searchParams.set("ch",chNo);history.replaceState(null,"",u);
}
function render(){
  if(!course){$("#content").innerHTML='<div class="empty">尚未建立任何課程。</div>';return}
  const chs=course.chapters;
  let ch=chs.find(c=>String(c.no)===String(chNo))||chs.find(c=>countDone(c)>0)||chs[0];
  chNo=ch?ch.no:"";
  document.title=course.name+" 動態網頁";
  $("#cTitle").textContent=course.name;$("#cDesc").textContent=course.desc||"";
  $("#courseSel").innerHTML=C.map(c=>`<option value="${esc(c.id)}"${c===course?" selected":""}>${esc(c.name)}</option>`).join("");
  $("#chList").innerHTML=chs.map(c=>`<li><button type="button" data-ch="${esc(c.no)}" aria-current="${c===ch}">第 ${esc(c.no)} 章 ${esc(c.title)}<span class="cnt">${countDone(c)}/${countAll(c)}</span></button></li>`).join("");
  $("#chList").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{chNo=b.dataset.ch;render();$("#content").scrollIntoView({block:"nearest"})}));
  if(!ch){$("#content").innerHTML='<div class="empty">這門課程還沒有章節。</div>';save();return}
  $("#content").innerHTML=`<div class="chhead"><h2>第 ${esc(ch.no)} 章　${esc(ch.title)}</h2><p>已完成 ${countDone(ch)} / ${countAll(ch)} 個項目</p></div>`+
    (ch.sections.length?ch.sections.map(s=>`<section><h3>${esc(s.title)}</h3><ul class="cards">${s.items.map(i=>i.href
      ?`<li><a class="card" href="${esc(i.href)}"><span class="no">${esc(i.no)}</span><b>${esc(i.title)}</b><span class="d">${esc(i.desc)}</span></a></li>`
      :`<li><div class="card todo"><span class="no">${esc(i.no)}</span><b>${esc(i.title)}</b><span class="d">製作中</span></div></li>`).join("")}</ul></section>`).join("")
    :'<div class="empty">這一章還沒有項目。</div>');
  save();
}
$("#courseSel").addEventListener("change",e=>{course=C.find(c=>c.id===e.target.value);chNo=null;render()});
render();
})();
</script>
</body>
</html>
